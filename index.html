<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>
        
        <div class="scoreboard">
            <div class="score-box">
                <span class="player-label x-color">Player X</span>
                <span id="scoreX" class="score-val">0</span>
            </div>
            <div class="score-box">
                <span class="player-label o-color">Player O</span>
                <span id="scoreO" class="score-val">0</span>
            </div>
        </div>

        <div class="status" id="status">Player X's turn</div>
        
        <div class="board" id="board">
            <!-- Dynamic Winning Line Overlay -->
            <div class="winning-line" id="winningLine"></div>
            
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="actions">
            <button class="btn" id="resetBtn">Reset Board</button>
            <button class="btn btn-secondary" id="resetAllBtn">Reset All</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
